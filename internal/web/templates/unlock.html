{{define "content"}}
<div class="center-stage">
<div class="fade-in-up max-w-md w-full">
    <div class="card p-8 space-y-5">
        <div>
            <img src="/static/favicon.svg" alt="" class="mb-4 rounded-card" width="48" height="48">
            <h1 class="font-display font-semibold text-2xl text-primary">Unlock Delistd</h1>
            <p class="mt-2 text-secondary">Your mail passwords are protected by a passphrase. Enter it once to start sending and checking your inbox.</p>
        </div>
        <form method="POST" action="/unlock" class="space-y-4">
            {{.CSRFField}}
            <div>
                <label for="passphrase" class="label">Passphrase</label>
                <input type="password" name="passphrase" id="passphrase" class="input" autocomplete="current-password" autofocus required>
            </div>
            {{if .Error}}<div class="alert alert-error">{{.Error}}</div>{{end}}
            <button type="submit" class="btn btn-primary">Unlock</button>
        </form>
        <p class="note">Forgot it? Re-enter your mail passwords with <code>delistd init</code>; there is no recovery.</p>
    </div>
</div>
</div>
{{end}}
