{{- /* Setup progress. Argument: the current step, 1 to 3; 4 means all done. */ -}}
<ol class="setup-steps" aria-label="Setup progress">
    <li class="setup-step{{if gt . 1}} done{{end}}{{if eq . 1}} current{{end}}"{{if eq . 1}} aria-current="step"{{end}}><span class="setup-step-n num">{{if gt . 1}}<svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/></svg>{{else}}1{{end}}</span><span class="setup-step-l">Welcome</span></li>
    <li class="setup-step{{if gt . 2}} done{{end}}{{if eq . 2}} current{{end}}"{{if eq . 2}} aria-current="step"{{end}}><span class="setup-step-n num">{{if gt . 2}}<svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/></svg>{{else}}2{{end}}</span><span class="setup-step-l">Your information</span></li>
    <li class="setup-step{{if gt . 3}} done{{end}}{{if eq . 3}} current{{end}}"{{if eq . 3}} aria-current="step"{{end}}><span class="setup-step-n num">{{if gt . 3}}<svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/></svg>{{else}}3{{end}}</span><span class="setup-step-l">Email</span></li>
</ol>
