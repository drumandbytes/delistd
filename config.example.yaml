# Delistd configuration. Copy to ~/.delistd/config.yaml and fill in your details.
# Mail passwords are stored encrypted (enc:v1:...). `delistd passphrase set` adds a
# passphrase on top and sets passphrase_protected: true; leave that key alone.

profiles:
  # One entry per person; most installs need just this one. Add more with
  # `delistd profile add` (docs/multi-profile.md).
  - id: default
    # Required
    first_name: John
    last_name: Doe
    email: john.doe@example.com

    # Optional, but the more brokers can match, the more records they find.
    address: "123 Main Street"
    city: "San Francisco"
    state: "CA"
    zip_code: "94102"
    country: US             # ISO 3166-1 alpha-2
    phone: "+1-555-123-4567"
    date_of_birth: "1990-01-15"   # YYYY-MM-DD

    # Other identities a broker may have indexed you under:
    # name_variants:        # a version without diacritics, a maiden name, a nickname
    #   - John Doe
    # additional_emails:    # addresses you used in the past
    #   - old.address@example.com
    # previous_addresses:   # places you lived in the last 5-7 years; a partial
    #   - Old Street 1, Old City, OC-12345   # address still helps (matching keys off street, city, postal code)

email:
  from: john.doe@example.com

  # Any SMTP provider. The wizard's presets (host:port): Gmail smtp.gmail.com:465,
  # Proton Bridge 127.0.0.1:1025, Fastmail smtp.fastmail.com:465, mailbox.org
  # smtp.mailbox.org:465, Posteo posteo.de:465, iCloud smtp.mail.me.com:587,
  # Amazon SES email-smtp.<region>.amazonaws.com:465 (username = the SES SMTP user).
  # Port 465 is TLS from the first byte; any other port must offer STARTTLS.
  smtp:
    host: smtp.fastmail.com
    port: 465
    username: john.doe@example.com
    password: your-app-password   # an app password, never your account password
    # use_tls: false              # only for an unauthenticated local relay

options:
  template: gdpr                  # gdpr, ccpa, generic or custom (see custom_template)

  # How the emails leave your machine:
  #   smtp (default)  Delistd sends them from the email: account above.
  #   manual          Delistd never sends. It renders the emails for you to send
  #                   yourself (`delistd draft`, `delistd send --manual`, or a
  #                   broker's "Email" page in the web UI) and you record each with
  #                   `delistd mark-sent`. No email: block needed.
  # send_mode: manual

  rate_limit_ms: 2000             # pause between emails, in milliseconds

  # Most emails `send` dispatches per rolling 24 hours, to stay under your
  # provider's cap (Gmail allows about 500 a day; others differ). Brokers emailed
  # in the last 25 days are skipped, so re-running `send` resumes where it stopped.
  # `--ignore-daily-limit` and `--resend` override this for one run.
  daily_send_limit: 450

  # Which built-in list to use: full (default, 700+ entries) or verified (a smaller
  # list of confirmed brokers with a working removal contact). `send --list` overrides.
  # broker_list: verified

  # Your own list instead of a built-in one (the global --brokers flag still wins).
  # broker_file: /home/you/.delistd/my-brokers.yaml

  # Narrow the brokers (all optional):
  # regions: [us, global]
  # excluded_brokers: [spokeo, whitepages]
  # excluded_categories: [requires-id]   # brokers that insist on a government ID document

# Run Delistd every 6 hours while `delistd serve` is open. Prefer
# `delistd schedule install` (or Settings -> Automation), which also works with the
# web UI closed; use this where the OS can't schedule it.
# schedule:
#   enabled: true
