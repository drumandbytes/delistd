name: PR title

# release-please reads the squash-merge title for the bump and the changelog.
# Advisory only, not in "Required checks passed": editing a title would cancel
# a running CI through ci.yml's concurrency group.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  title:
    name: Conventional title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@c5e23b7e584519ee15caa684cf60d056aa9f035f # v6.1.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            docs
            refactor
            test
            build
            ci
            chore
            revert
          # Scopes are the convention (feat(mcp):) but `docs:` alone is used too.
          requireScope: false
