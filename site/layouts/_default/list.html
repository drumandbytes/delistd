{{ define "main" }}
<div class="prose">
  <p class="crumb"><a href="{{ "/" | relURL }}">Home</a> <span class="sep" aria-hidden="true">/</span> {{ .Title }}</p>
  <h1>{{ .Title }}</h1>
  {{ .Content }}
  <ul class="linklist">
    {{ range .Pages.ByTitle }}
    <li><a href="{{ .RelPermalink }}">{{ .Title }}</a></li>
    {{ end }}
  </ul>
</div>
{{ end }}
