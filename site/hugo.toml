baseURL = "https://delistd.dev/"
# locale is derived from the default language; no explicit setting needed
title = "Delistd"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term", "RSS"]
enableGitInfo = true

# Broker pages are generated, so git has no history for them; their
# last_checked date is the real freshness signal. Feeds <lastmod> in the sitemap.
[frontmatter]
  lastmod = ["last_checked", ":git", "lastmod", "date"]

[params]
  description = "Send removal requests to 700+ data brokers from your own mailbox. Free, open source, and your details stay on your computer."
  repo = "https://github.com/drumandbytes/delistd"
  # Drumandbytes OÜ support inbox; shown on /support/
  supportEmail = "support@drumandbytes.com"

[markup.goldmark.renderer]
  unsafe = true

# Classes, not inline colours: the stylesheet colours code from the page tokens
# so it holds in light and dark.
[markup.highlight]
  noClasses = false

[[menu.main]]
  name = "Broker directory"
  pageRef = "/brokers"
  weight = 10
[[menu.main]]
  name = "Guides"
  pageRef = "/guides"
  weight = 20
[[menu.main]]
  name = "Compare"
  pageRef = "/compare"
  weight = 22
[[menu.main]]
  name = "Docs"
  pageRef = "/docs"
  weight = 25
[[menu.main]]
  name = "Authorities"
  pageRef = "/authorities"
  weight = 30
[[menu.main]]
  name = "Support"
  pageRef = "/support"
  weight = 35

[mediaTypes."text/x-redirects"]
  suffixes = [""]

[outputFormats.REDIRECTS]
  mediaType = "text/x-redirects"
  baseName = "_redirects"
  isPlainText = true
  notAlternative = true

[outputFormats.LLMS]
  mediaType = "text/plain"
  baseName = "llms"
  isPlainText = true
  notAlternative = true

[outputs]
  home = ["HTML", "REDIRECTS", "LLMS"]
